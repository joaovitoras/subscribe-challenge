inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4


Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/LineLength:
  Max: 112

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Style/Documentation:
  Enabled: false

# String literal is the default for ruby 3.4
Style/FrozenStringLiteralComment:
  Enabled: false

Style/WordArray:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Enabled: true
  Max: 4

RSpec/ExampleLength:
  Max: 10
